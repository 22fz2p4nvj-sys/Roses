<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Five Roses for You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;600&display=swap">
<style>
/* Layout: one centered column — bouquet vase grows above, apology card below, single action button. Night-garden single look by choice. */
:root{
  --night:#1c0e19; --night-2:#2a1526; --petal:#f4c3cc; --rose:#d9334f; --rose-deep:#9e1c35;
  --leaf:#4e7c55; --ink:#f8eaee; --muted:#c9a7b1;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Karla", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night) 70%);background-color:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,9vw,56px);line-height:1.02;margin:0;text-wrap:balance}
h1 em{color:var(--petal)}
.lede{margin:0;color:var(--muted);max-width:40ch}

.bouquet{position:relative;width:100%;max-width:420px;height:230px}
.bouquet svg.rose{position:absolute;bottom:40px;width:70px;height:150px;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.vase{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120px;height:60px;border-radius:10px 10px 40px 40px;background:linear-gradient(180deg,#3b2034,#2a1526);border:1px solid #5a3550}
@keyframes grow{from{transform:scaleY(0) rotate(var(--r));opacity:0}to{transform:scaleY(1) rotate(var(--r));opacity:1}}

.counter{font-family:var(--display);font-style:italic;font-size:20px;color:var(--petal);font-variant-numeric:tabular-nums}
.card{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(244,195,204,.18);border-radius:18px;padding:24px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .num{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card .sorry{font-family:var(--display);font-size:clamp(26px,6.5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.card .promise{margin:0;color:var(--muted);font-size:15px}
.card.fresh{animation:fade .6s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

button{font-family:var(--body);font-weight:600;font-size:16px;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:var(--rose);color:#fff;box-shadow:0 6px 24px -8px var(--rose);transition:transform .15s, background .15s}
button:hover{background:var(--rose-deep)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--petal);outline-offset:3px}
.ghost{background:transparent;color:var(--petal);box-shadow:none;border:1px solid rgba(244,195,204,.35)}
.ghost:hover{background:rgba(244,195,204,.08)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.final h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,8vw,46px);margin:0;line-height:1.1}
.final p{margin:0;color:var(--muted)}
.letter{display:flex;flex-direction:column;gap:14px;text-align:left;max-width:60ch;margin:0 auto}
.final .letter p{color:var(--ink);font-family:var(--display);font-size:clamp(19px,4.6vw,22px);line-height:1.45}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-30px;color:var(--rose);animation:float linear forwards}
@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div class="wrap">
  <div class="eyebrow">For you, from me</div>
  <h1>Five roses,<br><em>five sorries</em></h1>
  <p class="lede" id="lede">I know you're upset with me, and you have every right to be. Let me give you these one at a time.</p>

  <div class="bouquet" id="bouquet" aria-hidden="true"><div class="vase"></div></div>

  <div class="counter" id="counter">0 of 5 roses</div>

  <div class="card" id="card">
    <div class="num">Waiting</div>
    <p class="sorry">Tap below for your first rose</p>
  </div>

  <div class="row" id="actions">
    <button id="give">Take a rose 🌹</button>
  </div>
</div>
<div class="hearts" id="hearts"></div>

<script>
const sorries = [
  ["Sorry for being childish sometimes", "I'll try to act like the partner you deserve."],
  ["Sorry for telling you small lies", "You deserve the whole truth from me, every time."],
  ["Sorry for not listening to you", "I'm listening now, and I'll keep listening."],
  ["Sorry not sorry for talking too much and annoying you, thunu bht zayada tang karan layi 😜", "And that's never going to end. You're stuck with my bak-bak forever 😜"],
  ["Sorry for coming late into your life 😅", "But I'm here now, and I'm not going anywhere."]
];
const TOTAL = sorries.length;

let given = 0;
const bouquet = document.getElementById('bouquet');
const card = document.getElementById('card');
const counter = document.getElementById('counter');
const actions = document.getElementById('actions');

function roseSVG(){
  return `<svg class="rose" viewBox="0 0 70 150" xmlns="http://www.w3.org/2000/svg">
    <path d="M35 150 C34 115 36 85 35 52" stroke="#4e7c55" stroke-width="3.5" fill="none"/>
    <path d="M35 105 C22 98 14 100 10 92 C22 88 30 94 35 102Z" fill="#4e7c55"/>
    <path d="M35 85 C48 78 56 80 60 72 C48 68 40 74 35 82Z" fill="#5f9466"/>
    <ellipse cx="35" cy="38" rx="20" ry="18" fill="#9e1c35"/>
    <path d="M17 38 C17 22 30 16 35 24 C40 16 53 22 53 38 C48 30 40 34 35 40 C30 34 22 30 17 38Z" fill="#d9334f"/>
    <path d="M24 34 C26 24 34 22 35 30 C36 22 44 24 46 34 C42 30 38 32 35 36 C32 32 28 30 24 34Z" fill="#f05a72"/>
    <path d="M30 28 C31 22 39 22 40 28 C37 26 33 26 30 28Z" fill="#9e1c35"/>
    <path d="M18 42 C22 54 48 54 52 42 C46 50 24 50 18 42Z" fill="#b8243f"/>
  </svg>`;
}

function addRose(i){
  const mid = (TOTAL - 1) / 2;
  const left = 50 + (i - mid) * 44;
  const tilt = (i - mid) * 8;
  const h = 150 - Math.abs(i - mid) * 10;
  const wrap = document.createElement('div');
  wrap.innerHTML = roseSVG();
  const svg = wrap.firstElementChild;
  svg.style.left = `calc(50% + ${left - 50}px - 35px)`;
  svg.style.height = h + 'px';
  svg.style.setProperty('--r', tilt + 'deg');
  svg.style.zIndex = 10 - Math.round(Math.abs(i - mid));
  bouquet.insertBefore(svg, bouquet.querySelector('.vase'));
}

function showCard(i){
  const [s, p] = sorries[i];
  card.classList.remove('fresh'); void card.offsetWidth; card.classList.add('fresh');
  card.innerHTML = `<div class="num">Rose ${i + 1}</div><p class="sorry">${s}</p><p class="promise">${p}</p>`;
}

document.getElementById('give').addEventListener('click', function(){
  if (given < TOTAL){
    addRose(given); showCard(given); given++;
    counter.textContent = `${given} of ${TOTAL} roses`;
    this.textContent = given === TOTAL ? 'One more thing… 💌' : 'Next rose 🌹';
  } else {
    letter();
  }
});

function refresh(){ card.classList.remove('fresh'); void card.offsetWidth; card.classList.add('fresh','final'); }

function letter(){
  refresh();
  counter.textContent = 'A bonus, from my heart';
  card.innerHTML = `<div class="num">Bonus</div>
    <div class="letter">
      <p>I know I keep making the same silly mistakes, and I know every time I do, it hurts you a little more. That is the part that hurts me the most. I never, ever want to be the reason you're sad. You're the one I want to make smile, not the one I keep letting down.</p>
      <p>I'm not perfect, and I won't pretend to be. But I promise you this: I'm going to work on myself, for real this time. Not because I have to, but because you deserve someone who learns, who grows, and who never makes you feel the same pain twice.</p>
    </div>`;
  actions.innerHTML = `<button id="next">Keep going ❤️</button>`;
  document.getElementById('next').onclick = ask;
}

function ask(){
  refresh();
  counter.textContent = '';
  card.innerHTML = `<h2>Will you forgive me?</h2><p>Five roses can't fix everything, but I mean every single one.</p>`;
  actions.innerHTML = `<button id="yes">Yes, I forgive you ❤️</button><button class="ghost" id="think">Still thinking…</button>`;
  document.getElementById('yes').onclick = forgiven;
  document.getElementById('think').onclick = () => {
    refresh();
    card.innerHTML = `<h2>Take all the time you need.</h2><p>I'll be right here, holding the sixth rose. 🌹</p>`;
    actions.innerHTML = `<button id="yes2">Okay, okay… I forgive you ❤️</button>`;
    document.getElementById('yes2').onclick = forgiven;
  };
}

function forgiven(){
  refresh();
  card.innerHTML = `<h2>Thank you so much.</h2><p>Come here. Big hug, and I'm buying the food tonight.</p>`;
  actions.innerHTML = '';
  hearts();
}

function hearts(){
  const box = document.getElementById('hearts');
  for (let i = 0; i < 40; i++){
    const s = document.createElement('span');
    s.textContent = ['❤','🌹','❤'][i % 3];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (14 + Math.random() * 22) + 'px';
    s.style.animationDuration = (4 + Math.random() * 4) + 's';
    s.style.animationDelay = (Math.random() * 2) + 's';
    box.appendChild(s);
  }
}
</script>

</body>
</html>
